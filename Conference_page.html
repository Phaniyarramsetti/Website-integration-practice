<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website-integration-practice</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" integrity="sha384-JcKb8q3iqJ61gNV9KGb8thSsNjpSL0n8PARn9HuZOnIxN0hoP+VmmDGMN5t9UJ0Z" crossorigin="anonymous">
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js" integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN" crossorigin="anonymous"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js" integrity="sha384-B4gt1jrGC7Jh4AgTPSdUtOBvfO8shuf57BaghqFfPlYxofvL8/KUEfYiJOMMV+rV" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"> 
    <link rel="stylesheet" href="Conference_page.css">
</head>
<body>
    <div id="sectionhomepage">
        <img src="https://d2clawv67efefq.cloudfront.net/ccbp-static-website/conference-img.png" class="image" />
        <div class="bg-container">
            <h1 class="heading">The Things Conference</h1>
            <p class="paragraph">Redefining the future of IoT with LoRaWAN</p>
            <button class="btn btn-primary" onclick="display('section-Conference-details-page')">Know more</button>
        </div>
    </div>
    <div id="section-Conference-details-page">
        <div class="embed-responsive embed-responsive-1by1 video-container">
            <iframe src="https://www.youtube.com/embed/W_2hCKnzWj0?rel=0" allowfullscreen></iframe>
        </div>
        <div class="bg-container">
            <h1 class="conference-details-title">The Things Conference</h1>
            <p class="conference-details-description">Join Asia's Largest Conference on LoRaWaN</p>
            <div class="d-flex flex-row justify-content-center">
                <div class="conference-section">
                    <h1 class="conference-status-count">1400+</h1>
                    <p class="conference-status-label">Attendees</p>
                </div>
                <div class="conference-section">
                    <h1 class="conference-status-count">100+</h1>
                    <p class="conference-status-label">Workships</p>
                </div>
            </div>
            <div class="d-flex flex-row justify-content-center">
                <div class="conference-section">
                    <h1 class="conference-status-count">120+</h1>
                    <p class="conference-status-label">Speakers</p>
                </div>
                <div class="conference-section">
                    <h1 class="conference-status-count">10+</h1>
                    <p class="conference-status-label">Countries</p>
                </div>
            </div>
                <button class="btn btn-primary" onclick="display('sectionhomepage')">Back</button>
        </div>
    </div>
    <script type="text/javascript" src="https://new-assets.ccbp.in/frontend/content/static-ccbp-ui-kit/static-ccbp-ui-kit.js"></script>

</html>
